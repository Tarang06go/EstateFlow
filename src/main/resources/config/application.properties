# Non-secret defaults. Database credentials live in db.properties (never committed).
lease.expiry.warning.days=30
# v1.1: days ahead covered by the Rent Reminders screen
rent.reminder.days=7
# Optional local face matching: user must consent and enroll; threshold needs real-device calibration.
face.models.directory=
face.match.threshold=0.363
face.detection.score.threshold=0.70
face.camera.timeout.seconds=8
face.login.enabled=true
assistant.provider=none
